<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Motor Insurance Quote</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">

    <h1>Get a Motor Insurance Quote</h1>

    <div class="progress">
        <div class="progressStep active" id="progressStep1">1. Your Info</div>
        <div class="progressStep" id="progressStep2">2. Your Car</div>
        <div class="progressStep" id="progressStep3">3. Choose Plan</div>
        <div class="progressStep" id="progressStep4">4. Payment</div>
    </div>

    <form id="quoteForm" novalidate>

        <div class="steps active" id="step1">
            <h2>Your Information</h2>

            <label for="fullName">Full Name</label>
            <input type="text" id="fullName" required>

            <label for="age">Age</label>
            <input type="number" id="age" min="18" max="99" required>

            <label for="experience">Years of Driving Experience</label>
            <input type="number" id="experience" min="0" max="80" required>

            <label for="claims">Claims in the Last 3 Years</label>
            <input type="number" id="claims" min="0" max="10" value="0" required>

            <label for="email">Email</label>
            <input type="email" id="email" required>

            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" required>

            <label for="address">Address</label>
            <input type="text" id="address" required>

            <div class="theStepButtons">
                <button type="button" class="theNextButtons" data-next="2">Next: Car Info</button>
            </div>
        </div>

        <div class="steps" id="step2">
            <h2>Your Vehicle</h2>

            <label for="vehicleType">Vehicle Type</label>
            <select id="vehicleType" required>
                <option value="car">Car</option>
                <option value="truck">Truck</option>
            </select>

            <label for="make">Make (e.g. Toyota)</label>
            <input type="text" id="make" required>

            <label for="model">Model (e.g. Corolla)</label>
            <input type="text" id="model" required>

            <label for="plateNumber">License Plate Number</label>
            <input type="text" id="plateNumber" required>

            <label for="year">Manufacture Year</label>
            <input type="number" id="year" min="1980" max="2026" required>

            <label for="engineCc">Engine Size (cc)</label>
            <input type="number" id="engineCc" min="600" max="8000" required>

            <label for="marketValue">Estimated Market Value ($)</label>
            <input type="number" id="marketValue" min="0" required>

            <label for="fuelType">Fuel Type</label>
            <select id="fuelType" required>
                <option value="petrol">Petrol</option>
                <option value="diesel">Diesel</option>
                <option value="hybrid">Hybrid</option>
                <option value="electric">Electric</option>
            </select>

            <label for="usageType">Usage Type</label>
            <select id="usageType" required>
                <option value="private">Private</option>
                <option value="commercial">Commercial</option>
                <option value="ride_hailing">Ride-hailing (Uber/Careem etc.)</option>
            </select>

            <label for="annualMileage">Estimated Annual Mileage (km)</label>
            <input type="number" id="annualMileage" min="0" required>

            <label for="parking">Where is it parked overnight?</label>
            <select id="parking" required>
                <option value="garage">Garage / Private lot</option>
                <option value="street">Street</option>
            </select>

            <label for="region">Region</label>
            <select id="region" required>
                <option value="urban">Urban</option>
                <option value="rural">Rural</option>
            </select>

            <div class="theStepButtons">
                <button type="button" class="theBackButton" data-back="1">Back</button>
                <button type="button" class="theNextButtons" data-next="3">Next: Choose Plan</button>
            </div>
        </div>


        <div class="steps" id="step3">
            <h2>Choose Your Plan</h2>
            <p class="stepDiscription">Prices are calculated based on your info. Pick the coverage that's right for you.</p>

            <label for="coveragePeriod">Coverage Period</label>
            <select id="coveragePeriod">
                <option value="12">12 Months (best value)</option>
                <option value="6">6 Months</option>
                <option value="3">3 Months</option>
                <option value="1">1 Month</option>
            </select>

            <div class="plans" id="plansContainer">

            </div>

            <div class="theStepButtons">
                <button type="button" class="theBackButton" data-back="2">Back</button>
                <button type="button" class="theNextButtons" id="toPaymentBtn" data-next="4" disabled>Next: Payment</button>
            </div>
        </div>


        <div class="steps" id="step4">
            <h2>Payment</h2>

            <div class="summeryOfOrder" id="orderSummary">    </div>

            <label for="cardName">Name on Card</label>
            <input type="text" id="cardName" required>

            <label for="cardNumber">Card Number</label>
            <input type="text" id="cardNumber" maxlength="19" placeholder="4242 4242 4242 4242" required>

            <div class="theCardInfo">
                <div>
                    <label for="cardExpiry">Expiry (MM/YY)</label>
                    <input type="text" id="cardExpiry" maxlength="5" placeholder="MM/YY" required>
                </div>
                <div>
                    <label for="cardCvc">CVC</label>
                    <input type="text" id="cardCvc" maxlength="4" placeholder="123" required>
                </div>
            </div>

            <div class="theStepButtons">
                <button type="button" class="theBackButton" data-back="3">Back</button>
                <button type="submit" class="thePayButton">Pay &amp; Confirm</button>
            </div>

            <div id="resultMessage"></div>
        </div>

    </form>
</div>

<script src="script.js"></script>
</body>
</html>
